<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Flappy Finch</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700&display=swap');

  :root{
    --sky-top: #7ec8e3;
    --sky-bottom: #cdeef0;
    --pipe: #4caf6b;
    --pipe-dark: #3a8a53;
    --ground: #d9b26a;
    --ground-dark: #b5854a;
    --bird: #ffcc3d;
    --text-main: #23324a;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    height: 100%;
    background: var(--sky-bottom);
    font-family: 'Nunito', sans-serif;
    color: var(--text-main);
    overflow: hidden;
  }

  .wrap{
    max-width: 420px;
    margin: 0 auto;
    padding: 22px 16px 30px;
    text-align: center;
  }

  h1{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(1.7rem, 7vw, 2.2rem);
    margin: 0 0 2px;
    color: #d9862a;
  }

  .tagline{
    margin: 0 0 14px;
    font-size: 0.88rem;
    color: #56698a;
  }

  .hud{
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 12px;
  }

  .stat{
    background: #ffffffcc;
    border: 2px solid #a9d6dd;
    border-radius: 10px;
    padding: 7px 18px;
    min-width: 76px;
  }

  .stat .label{
    font-size: 0.65rem;
    font-weight: 700;
    color: #6b83a3;
  }

  .stat .value{
    font-family: 'Baloo 2', sans-serif;
    font-size: 1.3rem;
    font-weight: 700;
    color: #23324a;
  }

  #best-val{ color: #d9862a; }

  .stage{
    position: relative;
    display: inline-block;
    border-radius: 14px;
    overflow: hidden;
    border: 4px solid #3a8a53;
    box-shadow: 0 10px 24px rgba(0,0,0,0.25);
  }

  canvas{
    display: block;
    touch-action: none;
  }

  .overlay{
    position: absolute;
    inset: 0;
    background: rgba(35,50,74,0.72);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 20px;
  }

  .overlay.hidden{ display: none; }

  .overlay h2{
    font-family: 'Baloo 2', sans-serif;
    font-size: 1.5rem;
    margin: 0;
  }

  .overlay p{
    margin: 0;
    font-size: 0.85rem;
    color: #dfe8f5;
    max-width: 260px;
    line-height: 1.4;
  }

  #go-btn{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    color: #23324a;
    background: var(--bird);
    border: none;
    border-radius: 999px;
    padding: 11px 30px;
    cursor: pointer;
    box-shadow: 0 4px 0 #cf9e1f;
    margin-top: 4px;
  }

  #go-btn:active{
    transform: translateY(3px);
    box-shadow: 0 1px 0 #cf9e1f;
  }

  .controls-hint{
    margin-top: 12px;
    font-size: 0.78rem;
    color: #56698a;
  }
</style>
</head>
<body>

<div class="wrap">
  <h1>Flappy Finch</h1>
  <p class="tagline">Tap to flap. Thread the gaps between the hedges without clipping one.</p>

  <div class="hud">
    <div class="stat">
      <div class="label">SCORE</div>
      <div class="value" id="score-val">0</div>
    </div>
    <div class="stat">
      <div class="label">BEST</div>
      <div class="value" id="best-val">0</div>
    </div>
  </div>

  <div class="stage">
    <canvas id="game" width="340" height="440"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlay-title">Ready to flap?</h2>
      <p id="overlay-text">Tap, click, or press space to flap upward. Gravity pulls you down constantly. Thread every gap — one clip and it's over.</p>
      <button id="go-btn">Start</button>
    </div>
  </div>

  <p class="controls-hint">Space / tap / click to flap</p>
</div>

<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const GROUND_H = 36;

  const scoreVal = document.getElementById('score-val');
  const bestVal = document.getElementById('best-val');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlayText = document.getElementById('overlay-text');
  const goBtn = document.getElementById('go-btn');

  let best = 0;
  let running = false;
  let rafId = null;
  let lastTime = 0;

  let bird, pipes, score, groundOffset, spawnTimer;

  const GRAVITY = 0.4;
  const FLAP_V = -7.2;
  const PIPE_W = 52;
  const GAP = 128;
  const PIPE_SPEED = 2.4;

  function resetState(){
    bird = { x: 80, y: H/2, vy: 0, r: 14, rot: 0 };
    pipes = [];
    score = 0;
    groundOffset = 0;
    spawnTimer = 0;
    scoreVal.textContent = 0;
  }

  function spawnPipe(){
    const margin = 50;
    const gapCenter = margin + Math.random()*(H - GROUND_H - margin*2 - GAP) + GAP/2;
    pipes.push({ x: W + PIPE_W, gapCenter, passed: false });
  }

  function flap(){
    if(!running) return;
    bird.vy = FLAP_V;
  }

  function update(dt){
    const t = dt/16.7;
    bird.vy += GRAVITY * t;
    bird.y += bird.vy * t;
    bird.rot = Math.max(-0.5, Math.min(1.1, bird.vy * 0.08));

    groundOffset = (groundOffset + PIPE_SPEED*t) % 30;

    spawnTimer -= dt;
    if(spawnTimer <= 0){
      spawnPipe();
      spawnTimer = 1500;
    }

    for(let i = pipes.length - 1; i >= 0; i--){
      const p = pipes[i];
      p.x -= PIPE_SPEED * t;

      const birdLeft = bird.x - bird.r, birdRight = bird.x + bird.r;
      const birdTop = bird.y - bird.r, birdBottom = bird.y + bird.r;
      const pipeLeft = p.x, pipeRight = p.x + PIPE_W;
      const gapTop = p.gapCenter - GAP/2, gapBottom = p.gapCenter + GAP/2;

      if(birdRight > pipeLeft && birdLeft < pipeRight){
        if(birdTop < gapTop || birdBottom > gapBottom){
          endGame();
          return;
        }
      }

      if(!p.passed && p.x + PIPE_W < bird.x){
        p.passed = true;
        score++;
        scoreVal.textContent = score;
      }

      if(p.x + PIPE_W < -10) pipes.splice(i,1);
    }

    if(bird.y + bird.r > H - GROUND_H){
      endGame();
      return;
    }
    if(bird.y - bird.r < 0){
      bird.y = bird.r;
      bird.vy = 0;
    }
  }

  function drawBackdrop(){
    const grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0, '#7ec8e3');
    grad.addColorStop(1, '#cdeef0');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    // soft clouds
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    [[60,70,26],[220,50,20],[300,110,18]].forEach(([x,y,r]) => {
      ctx.beginPath();
      ctx.arc(x,y,r,0,Math.PI*2);
      ctx.arc(x+r*0.8,y+4,r*0.7,0,Math.PI*2);
      ctx.fill();
    });
  }

  function drawPipes(){
    pipes.forEach(p => {
      const gapTop = p.gapCenter - GAP/2, gapBottom = p.gapCenter + GAP/2;
      ctx.fillStyle = '#4caf6b';
      ctx.fillRect(p.x, 0, PIPE_W, gapTop);
      ctx.fillRect(p.x, gapBottom, PIPE_W, H - GROUND_H - gapBottom);
      ctx.fillStyle = '#3a8a53';
      ctx.fillRect(p.x - 4, gapTop - 16, PIPE_W + 8, 16);
      ctx.fillRect(p.x - 4, gapBottom, PIPE_W + 8, 16);
    });
  }

  function drawGround(){
    ctx.fillStyle = '#d9b26a';
    ctx.fillRect(0, H - GROUND_H, W, GROUND_H);
    ctx.fillStyle = '#b5854a';
    for(let x = -groundOffset; x < W; x += 30){
      ctx.fillRect(x, H - GROUND_H, 16, 6);
    }
  }

  function drawBird(){
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rot);
    ctx.fillStyle = '#ffcc3d';
    ctx.beginPath();
    ctx.arc(0,0,bird.r,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#ff8f3d';
    ctx.beginPath();
    ctx.moveTo(bird.r-2, -3);
    ctx.lineTo(bird.r+9, 0);
    ctx.lineTo(bird.r-2, 4);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#23324a';
    ctx.beginPath();
    ctx.arc(4, -4, 2.4, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function render(){
    drawBackdrop();
    drawPipes();
    drawGround();
    drawBird();
  }

  function loop(now){
    if(!running) return;
    const dt = Math.min(32, now - lastTime);
    lastTime = now;
    update(dt);
    render();
    rafId = requestAnimationFrame(loop);
  }

  function endGame(){
    running = false;
    cancelAnimationFrame(rafId);
    if(score > best){
      best = score;
      bestVal.textContent = best;
      overlayTitle.textContent = 'New best!';
    } else {
      overlayTitle.textContent = 'Clipped it!';
    }
    overlayText.textContent = `Score: ${score}`;
    goBtn.textContent = 'Try again';
    overlay.classList.remove('hidden');
  }

  function startGame(){
    resetState();
    overlay.classList.add('hidden');
    running = true;
    lastTime = performance.now();
    rafId = requestAnimationFrame(loop);
  }

  goBtn.addEventListener('click', startGame);
  window.addEventListener('keydown', (e) => {
    if(e.key === ' '){ e.preventDefault(); flap(); }
  });
  canvas.addEventListener('pointerdown', flap);

  resetState();
  render();
</script>

</body>
</html>
