<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Brick Breaker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&display=swap');
  :root{
    --bg:#0f1320; --panel:#1a2036; --line:#2b3352;
    --paddle:#4fd6ff; --ball:#ffd166; --text:#eef1fb; --dim:#7c86ab;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);font-family:'Rubik',sans-serif;color:var(--text);overflow:hidden;}
  .wrap{max-width:460px;margin:0 auto;padding:22px 16px 30px;text-align:center;}
  h1{font-weight:800;font-size:clamp(1.7rem,7vw,2.2rem);margin:0 0 2px;color:var(--paddle);}
  .tagline{margin:0 0 14px;font-size:0.86rem;color:var(--dim);}
  .hud{display:flex;justify-content:center;gap:10px;margin-bottom:12px;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 16px;min-width:76px;}
  .stat .label{font-size:0.63rem;font-weight:600;color:var(--dim);}
  .stat .value{font-weight:800;font-size:1.25rem;}
  #score-val{color:var(--ball);}
  #lives-val{color:#ef476f;}
  #best-val{color:var(--paddle);}
  .stage{position:relative;display:inline-block;border-radius:14px;overflow:hidden;border:2px solid var(--line);background:var(--panel);}
  canvas{display:block;touch-action:none;}
  .overlay{position:absolute;inset:0;background:rgba(15,19,32,0.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;}
  .overlay.hidden{display:none;}
  .overlay h2{font-size:1.4rem;margin:0;color:#ef476f;}
  .overlay p{margin:0;font-size:0.85rem;color:var(--dim);max-width:260px;line-height:1.4;}
  #go-btn{font-weight:800;font-size:0.95rem;color:#0f1320;background:var(--ball);border:none;border-radius:999px;padding:11px 30px;cursor:pointer;margin-top:4px;}
  .controls{margin-top:12px;font-size:0.78rem;color:var(--dim);}
</style>
</head>
<body>
<div class="wrap">
  <h1>BRICK BREAKER</h1>
  <p class="tagline">Bounce the ball off your paddle to smash every brick. Don't let it fall.</p>
  <div class="hud">
    <div class="stat"><div class="label">SCORE</div><div class="value" id="score-val">0</div></div>
    <div class="stat"><div class="label">LIVES</div><div class="value" id="lives-val">3</div></div>
    <div class="stat"><div class="label">BEST</div><div class="value" id="best-val">0</div></div>
  </div>
  <div class="stage">
    <canvas id="game" width="360" height="420"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlay-title">Ready?</h2>
      <p id="overlay-text">Move the paddle with your mouse, arrow keys, or by dragging. Clear every brick to advance — three misses ends the game.</p>
      <button id="go-btn">Start</button>
    </div>
  </div>
  <p class="controls">← → arrows, mouse, or drag to move the paddle</p>
</div>

<script>
  const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  const scoreVal=document.getElementById('score-val'), livesVal=document.getElementById('lives-val'), bestVal=document.getElementById('best-val');
  const overlay=document.getElementById('overlay'), overlayTitle=document.getElementById('overlay-title'), overlayText=document.getElementById('overlay-text'), goBtn=document.getElementById('go-btn');

  const ROWS=6, COLS=8, BRICK_W=40, BRICK_H=16, BRICK_PAD=4, BRICK_TOP=40, BRICK_LEFT=8;
  const ROW_COLORS=['#ef476f','#ff9f4f','#ffd166','#06d6a0','#4fd6ff','#c77dff'];

  let paddle, ball, bricks, score, lives, best=0, running, rafId, lastTime, ballLaunched;

  function resetLevel(){
    bricks=[];
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
      bricks.push({ x: BRICK_LEFT + c*(BRICK_W+BRICK_PAD), y: BRICK_TOP + r*(BRICK_H+BRICK_PAD), w:BRICK_W, h:BRICK_H, alive:true, color: ROW_COLORS[r] });
    }
  }

  function resetBall(){
    ball = { x: paddle.x + paddle.w/2, y: paddle.y - 10, r:7, vx: 3.4*(Math.random()<0.5?-1:1), vy:-4.2 };
    ballLaunched=false;
  }

  function resetState(){
    paddle = { x: W/2-40, y: H-24, w:80, h:12 };
    score=0; lives=3;
    resetLevel();
    resetBall();
    scoreVal.textContent=0; livesVal.textContent=3;
  }

  function launchBall(){ ballLaunched=true; }

  function update(dt){
    const t=dt/16.7;
    if(!ballLaunched){
      ball.x = paddle.x + paddle.w/2;
      ball.y = paddle.y - 10;
      return;
    }
    ball.x += ball.vx*t;
    ball.y += ball.vy*t;

    if(ball.x - ball.r < 0){ ball.x=ball.r; ball.vx*=-1; }
    if(ball.x + ball.r > W){ ball.x=W-ball.r; ball.vx*=-1; }
    if(ball.y - ball.r < 0){ ball.y=ball.r; ball.vy*=-1; }

    // paddle collision
    if(ball.y + ball.r > paddle.y && ball.y + ball.r < paddle.y + paddle.h + 10 &&
       ball.x > paddle.x && ball.x < paddle.x + paddle.w && ball.vy > 0){
      const hitPos = (ball.x - (paddle.x + paddle.w/2)) / (paddle.w/2);
      ball.vx = hitPos * 5.5;
      ball.vy = -Math.abs(ball.vy);
      ball.y = paddle.y - ball.r - 1;
    }

    // brick collision
    for(const b of bricks){
      if(!b.alive) continue;
      if(ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w && ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h){
        b.alive=false;
        score+=10;
        scoreVal.textContent=score;
        const overlapX = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
        const overlapY = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
        if(overlapX < overlapY) ball.vx*=-1; else ball.vy*=-1;
        break;
      }
    }

    if(bricks.every(b=>!b.alive)){
      resetLevel();
      ball.vx *= 1.08; ball.vy *= 1.08;
    }

    if(ball.y - ball.r > H){
      lives--;
      livesVal.textContent=lives;
      if(lives<=0){ endGame(); return; }
      resetBall();
    }
  }

  function render(){
    ctx.fillStyle='#1a2036';
    ctx.fillRect(0,0,W,H);

    bricks.forEach(b=>{
      if(!b.alive) return;
      ctx.fillStyle=b.color;
      ctx.beginPath();
      ctx.roundRect(b.x,b.y,b.w,b.h,3);
      ctx.fill();
    });

    ctx.fillStyle='#4fd6ff';
    ctx.beginPath();
    ctx.roundRect(paddle.x,paddle.y,paddle.w,paddle.h,6);
    ctx.fill();

    ctx.fillStyle='#ffd166';
    ctx.beginPath();
    ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
    ctx.fill();

    if(!ballLaunched){
      ctx.fillStyle='rgba(255,255,255,0.7)';
      ctx.font='13px Rubik, sans-serif';
      ctx.textAlign='center';
      ctx.fillText('Tap / click to launch', W/2, H/2);
    }
  }

  function loop(now){
    if(!running) return;
    const dt=Math.min(32, now-lastTime); lastTime=now;
    update(dt);
    render();
    rafId=requestAnimationFrame(loop);
  }

  function endGame(){
    running=false;
    cancelAnimationFrame(rafId);
    if(score>best){ best=score; bestVal.textContent=best; overlayTitle.textContent='New best!'; }
    else overlayTitle.textContent='Game over!';
    overlayText.textContent=`Score: ${score}`;
    goBtn.textContent='Play again';
    overlay.classList.remove('hidden');
  }

  function startGame(){
    resetState();
    overlay.classList.add('hidden');
    running=true; lastTime=performance.now();
    rafId=requestAnimationFrame(loop);
  }

  goBtn.addEventListener('click', startGame);

  function movePaddleTo(clientX){
    const rect=canvas.getBoundingClientRect();
    const x=(clientX-rect.left)*(W/rect.width);
    paddle.x = Math.max(0, Math.min(W-paddle.w, x-paddle.w/2));
  }

  canvas.addEventListener('mousemove',(e)=>movePaddleTo(e.clientX));
  canvas.addEventListener('pointerdown',(e)=>{ movePaddleTo(e.clientX); if(!ballLaunched) launchBall(); });
  canvas.addEventListener('touchmove',(e)=>{ e.preventDefault(); movePaddleTo(e.touches[0].clientX); },{passive:false});

  window.addEventListener('keydown',(e)=>{
    if(e.key==='ArrowLeft') paddle.x=Math.max(0,paddle.x-24);
    else if(e.key==='ArrowRight') paddle.x=Math.min(W-paddle.w,paddle.x+24);
    else if(e.key===' ' && !ballLaunched) launchBall();
  });

  resetState();
  render();
</script>
</body>
</html>
